[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }
quote = "1"
proc-macro2 = "1"
rusqlite = { version = "0.41", features = ["bundled"] }

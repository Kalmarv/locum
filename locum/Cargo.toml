[package]
name = "locum"
description = "Captures everything a Direct3D 11 game draws in a frame, to look at, query, change and replay: d3d11.dll and dxgi.dll beside the game that watch every call on its way to the real runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["direct3d", "d3d11", "capture", "graphics", "debugging"]
categories = ["development-tools::debugging", "graphics"]

[lib]
crate-type = ["cdylib"]

[dependencies]
locum-capture = { version = "0.1.0", path = "../capture" }
locum-d3d11 = { version = "0.1.0", path = "../d3d11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

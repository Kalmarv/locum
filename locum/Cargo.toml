[package]
name = "locum"
description = "Captures everything a Direct3D 11 game draws in a frame, to look at, query, change and replay: d3d11.dll and dxgi.dll beside the game that watch every call on its way to the real runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["direct3d", "d3d11", "capture", "graphics", "debugging"]
categories = ["development-tools::debugging", "graphics"]

[lib]
crate-type = ["cdylib"]

[dependencies]
locum-capture = { version = "0.1.5", path = "../capture" }
locum-d3d11 = { version = "0.1.5", path = "../d3d11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
# docs.rs has no MSVC tools to build the bundled SQLite; documentation needs no linking, so take the linked path there
cargo-args = ["--config", "env.LIBSQLITE3_SYS_USE_PKG_CONFIG=\"1\""]

# the release download locum-x86_64-pc-windows-msvc.zip: locum.dll and the shims that go beside it, which the
# workspace build dist runs makes too
[package.metadata.dist]
package-libraries = ["cdylib"]
include = [
    "../target/x86_64-pc-windows-msvc/dist/d3d11.dll",
    "../target/x86_64-pc-windows-msvc/dist/dxgi.dll",
    "../target/x86_64-pc-windows-msvc/dist/d3d12.dll",
    "../target/x86_64-pc-windows-msvc/dist/nvapi64.dll",
]

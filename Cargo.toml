[workspace]
resolver = "3"
members = ["capture", "cli", "d3d11", "locum", "shims/d3d11", "shims/dxgi", "shims/d3d12", "shims/nvapi64", "smoke", "smoke-d3d12", "xtask"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/locum"

[workspace.dependencies]
windows = { version = "=0.62.2", default-features = false }
dxbc-reader = "0.11.0"
dxcontainer = "0.11.0"
dxil-reader = "0.11.0"
iridia-analysis = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "d0e5aaa99b1d643dc3500f590e98357852531788" }
iridia-dxbc = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "d0e5aaa99b1d643dc3500f590e98357852531788" }
iridia-dxil = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "d0e5aaa99b1d643dc3500f590e98357852531788" }
iridia-ir = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "d0e5aaa99b1d643dc3500f590e98357852531788" }
iridia-naga = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "d0e5aaa99b1d643dc3500f590e98357852531788" }
iridia-passes = { version = "0.6.0", git = "https://github.com/Kalmarv/iridia", rev = "d0e5aaa99b1d643dc3500f590e98357852531788" }
primase-foundations = { version = "0.3.3", features = ["compress"] }
primase-testdata = "0.2.6"

[profile.release]
debug = "line-tables-only"
panic = "abort"

# the profile dist builds the release downloads with
[profile.dist]
inherits = "release"

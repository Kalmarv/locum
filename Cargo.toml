[workspace]
resolver = "3"
members = ["capture", "cli", "d3d11", "locum", "shims/d3d11", "shims/dxgi", "shims/d3d12", "shims/nvapi64", "smoke", "smoke-d3d12", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/locum"

[workspace.dependencies]
windows = { version = "=0.62.2", default-features = false }
dxbc-reader = "0.5.0"
dxcontainer = "0.5.0"
dxil-reader = "0.5.0"
iridia = "0.5.0"
iridia-dxbc = "0.5.0"
iridia-dxil = "0.5.0"
primase-foundations = { version = "0.3.3", features = ["compress"] }

[profile.release]
debug = "line-tables-only"
panic = "abort"

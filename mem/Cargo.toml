[package]
name = "locum-mem"
description = "Out-of-process, zero-suspend CPU and GPU (VidMm/DxgKrnl ETW) memory ground-truth inspection and reconciliation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
# New crate: keep publish = false until first manual crates.io publish + trusted-publishing setup (CONTRIBUTING.md).
publish = false
keywords = ["direct3d", "d3d12", "memory", "etw", "vidmm"]
categories = ["development-tools::debugging", "graphics"]

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { workspace = true, features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

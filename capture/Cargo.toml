[package]
name = "locum-capture"
description = "locum's capture format and the parts of capturing that do not depend on the graphics API: the database, the blob store, DXGI formats, layouts, stacks, shader reflection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dxbc-reader.workspace = true
dxil-reader.workspace = true
primase-foundations.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows = { workspace = true, features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
texture2ddecoder = "0.1.2"

[package]
name = "locum-capture"
description = "locum's capture format and the parts of capturing that do not depend on the graphics API: the database, the blob store, DXGI formats, layouts, stacks, shader reflection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

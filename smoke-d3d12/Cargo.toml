[package]
name = "locum-smoke-d3d12"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
locum-capture = { path = "../capture" }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Dxc", "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_WindowsAndMessaging",
] }

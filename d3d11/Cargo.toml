[package]
name = "locum-d3d11"
description = "Direct3D 11 pieces shared by locum in the game and by replay: reading resources back into locum's canonical layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["direct3d", "d3d11", "capture", "graphics", "debugging"]
categories = ["development-tools::debugging", "graphics"]

[dependencies]
locum-capture = { version = "0.1.6", path = "../capture" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
# docs.rs has no MSVC tools to build the bundled SQLite; documentation needs no linking, so take the linked path there
cargo-args = ["--config", "env.LIBSQLITE3_SYS_USE_PKG_CONFIG=\"1\""]

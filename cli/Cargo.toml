[package]
name = "locum-cli"
description = "Reads locum's captures: what a frame drew and with what, what the capture is missing, and the textures, buffers and targets in it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["direct3d", "d3d11", "capture", "graphics", "debugging"]
categories = ["development-tools::debugging", "graphics"]

[[bin]]
name = "locum-cli"
path = "src/main.rs"

[dependencies]
dxcontainer.workspace = true
dxil-reader.workspace = true
iridia-analysis.workspace = true
iridia-dxbc.workspace = true
iridia-dxil.workspace = true
iridia-ir.workspace = true
iridia-naga.workspace = true
iridia-passes.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
locum-capture = { version = "0.1.6", path = "../capture" }
locum-d3d11 = { version = "0.1.6", path = "../d3d11" }
memchr = "2.8.3"
memmap2 = "0.9.12"
png = "0.18.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tar = { version = "=0.4.46", default-features = false }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ProcessSnapshotting",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

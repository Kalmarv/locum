[package]
name = "locum-cli"
description = "Reads locum's captures: what a frame drew and with what, what the capture is missing, and the textures, buffers and targets in it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "locum-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
locum-capture = { path = "../capture" }
png = "0.18.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
windows = { workspace = true, features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }
